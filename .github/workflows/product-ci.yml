name: Product CI
run-name: "product-ci ${{ inputs.branch }} ${{ inputs.nonce }}"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Sandbox product branch (product/<slug>)
        required: true
      nonce:
        description: Correlation id
        required: false
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/ci.sh
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --no-git
